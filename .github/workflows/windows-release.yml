name: Windows release

# Builds ReleaseKit.exe on a Windows machine with ffmpeg bundled, checks that it actually
# starts and renders a video, then publishes the zip as a GitHub Release.
# Runs on every push to main (and by hand from the Actions tab). A new release is published
# only when the version in releasekit/__init__.py doesn't have a release yet, so bump that
# number to ship a new version; other pushes just produce a downloadable build artifact.
on:
  push:
    branches: [main]
    paths: ["releasekit/**", "packaging/**", "assets/**", "requirements*.txt", ".github/workflows/windows-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release   # one build at a time, so two pushes can't race to publish the same version
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-youtube.txt pyinstaller

      - name: Download ffmpeg (BtbN static build, GPL, shared libs)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = Get-ChildItem ff -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory -Force ffbin | Out-Null
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" ffbin
          Copy-Item "$($bin.FullName)\*.dll" ffbin
          $lic = Get-ChildItem ff -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "ffbin\FFMPEG-LICENSE.txt" }
          & ffbin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Build ReleaseKit.exe
        run: >
          pyinstaller packaging/launcher.py --name ReleaseKit --onedir --console --noconfirm
          --paths . --collect-submodules releasekit
          --icon assets/icon.ico
          --add-data "releasekit/templates;releasekit/templates"
          --add-data "releasekit/static;releasekit/static"
          --collect-submodules googleapiclient --collect-data googleapiclient

      - name: Add ffmpeg and docs
        shell: pwsh
        run: |
          Copy-Item ffbin dist\ReleaseKit\bin -Recurse
          Copy-Item README.md dist\ReleaseKit\
          Copy-Item packaging\START-HERE.txt dist\ReleaseKit\

      - name: Smoke test (start the app and render a real video)
        shell: pwsh
        run: |
          $env:RELEASEKIT_NO_BROWSER = "1"
          $env:RELEASEKIT_HOME = "$env:RUNNER_TEMP\rkhome"
          $exe = Resolve-Path dist\ReleaseKit\ReleaseKit.exe
          $out = "$env:RUNNER_TEMP\rk-out.txt"; $err = "$env:RUNNER_TEMP\rk-err.txt"
          $p = Start-Process $exe -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 2
            if ($p.HasExited) { break }
            try { $init = Invoke-RestMethod http://127.0.0.1:5577/api/init; $ok = $true; break } catch {}
          }
          if (-not $ok) {
            Write-Host "---- app output ----"; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "---- app errors ----"; Get-Content $err -ErrorAction SilentlyContinue
            throw "App did not start (exited: $($p.HasExited))"
          }
          if ($init.missing_tools.Count -gt 0) { throw "ffmpeg not found inside the build: $($init.missing_tools)" }
          if (-not $init.youtube_available) { throw "YouTube upload libraries missing from the build" }
          $wav = "$env:RUNNER_TEMP\tone.wav"
          & dist\ReleaseKit\bin\ffmpeg.exe -v error -y -f lavfi -i "sine=f=330:d=8" $wav
          function Run-Job($body) {
            $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:5577/api/jobs -ContentType "application/json" -Body ($body | ConvertTo-Json -Depth 6)
            $id = $r.jobs[0]
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep 2
              $j = (Invoke-RestMethod http://127.0.0.1:5577/api/jobs) | Where-Object { $_.id -eq $id }
              if ($j.status -eq "done") { return $j }
              if ($j.status -eq "error") { Get-Content $err -Tail 40 -ErrorAction SilentlyContinue; throw "Job failed: $($j.error)" }
            }
            throw "Job timed out"
          }
          $rel = @{ title = "Smoke"; artist = "CI"; tracks = @(@{ path = $wav; title = "Tone" }) }
          $cover = Run-Job @{ kinds = @("cover"); release = $rel; params = @{ mode = "generate"; seed = 1 } }
          $rel.art_path = $cover.result.path
          $vid = Run-Job @{ kinds = @("release_video"); release = $rel; params = @{ visualizer = "waves" } }
          if (-not (Test-Path $vid.result.path)) { throw "Video file missing" }
          Write-Host "Rendered $($vid.result.path)"
          $bump = Run-Job @{ kinds = @("release_video"); release = $rel; params = @{ vstyle = @{ visualizer = "mirror"; bump = "disc"; vis_color = "green" } } }
          if (-not (Test-Path $bump.result.path)) { throw "Bump video file missing" }
          Write-Host "Rendered beat-bump video $($bump.result.path)"
          $loop = Run-Job @{ kinds = @("long_video"); release = $rel; params = @{ hours = 0.01; visual = "pan"; vstyle = @{ visualizer = "bars"; bump = "cover" } } }
          Write-Host "Rendered loop video $($loop.result.path)"
          Stop-Process $p.Id -Force
          Get-Content $err -Tail 20 -ErrorAction SilentlyContinue

      - name: Self-update test (update an installed copy to a fake newer version)
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\updtest"
          New-Item -ItemType Directory -Force "$root\installed", "$root\stage" | Out-Null
          Copy-Item dist\ReleaseKit "$root\installed\ReleaseKit" -Recurse
          Copy-Item dist\ReleaseKit "$root\stage\ReleaseKit" -Recurse
          "new version" | Out-File "$root\stage\ReleaseKit\UPDATED-MARKER.txt"
          Compress-Archive -Path "$root\stage\ReleaseKit" -DestinationPath "$root\fake-update.zip"
          $env:RELEASEKIT_NO_BROWSER = "1"
          $env:RELEASEKIT_HOME = "$root\home"
          $env:RELEASEKIT_UPDATE_TEST_ZIP = "$root\fake-update.zip"
          $env:RELEASEKIT_UPDATE_TEST_VERSION = "99.0.0"
          $inst = "$root\installed\ReleaseKit"
          $p = Start-Process "$inst\ReleaseKit.exe" -PassThru
          $up = $false
          for ($i = 0; $i -lt 45; $i++) { Start-Sleep 2; try { Invoke-RestMethod http://127.0.0.1:5577/api/version | Out-Null; $up = $true; break } catch {} }
          if (-not $up) { throw "Installed copy did not start" }
          $c = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:5577/api/update/check -ContentType "application/json" -Body "{}"
          if (-not $c.newer -or -not $c.can_self_update) { throw "Update check wrong: $($c | ConvertTo-Json)" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:5577/api/update/apply -ContentType "application/json" -Body "{}" | Out-Null
          if (-not $p.WaitForExit(30000)) { throw "Old version did not close" }
          Write-Host "Old version closed; waiting for the updated one"
          $back = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { Invoke-RestMethod http://127.0.0.1:5577/api/version | Out-Null; $back = $true; break } catch {} }
          Write-Host "---- update-log.txt ----"; Get-Content "$inst\update-log.txt" -ErrorAction SilentlyContinue
          Write-Host "---- helper output ----"; Get-Content "$inst\update-helper-output.txt" -ErrorAction SilentlyContinue
          if (Test-Path "$inst\UPDATE-FAILED.txt") { Get-Content "$inst\UPDATE-FAILED.txt"; throw "Updater reported a copy failure" }
          if (-not (Test-Path "$inst\UPDATED-MARKER.txt")) { throw "New files were not copied in" }
          if (-not $back) { throw "Updated app did not restart" }
          Write-Host "Self-update OK: files replaced and app restarted"
          Get-Process ReleaseKit -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ReleaseKit -DestinationPath ReleaseKit-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ReleaseKit-windows-x64
          path: ReleaseKit-windows-x64.zip

      - name: Publish GitHub Release (new version only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Select-String -Path releasekit\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released; build kept as an artifact only."; exit 0 }
          gh release create $tag ReleaseKit-windows-x64.zip --target "${{ github.sha }}" --title "Release Kit $tag" --notes-file packaging/RELEASE_NOTES.md
          Write-Host "Published $tag"
